name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.version-check.outputs.should-release }}
      version: ${{ steps.version-check.outputs.version }}
      tag-exists: ${{ steps.version-check.outputs.tag-exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Get all history for tag checking
          persist-credentials: false

      - name: Get version from setup.py
        id: get-version
        run: |
          VERSION=$(python setup.py --version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if tag exists
        id: check-tag
        run: |
          TAG="v${{ steps.get-version.outputs.version }}"
          if git tag --list | grep -q "^$TAG$"; then
            echo "tag-exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists"
          else
            echo "tag-exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG does not exist"
          fi

      - name: Check if PR contains version bump
        id: version-check
        run: |
          # Check if the latest commit message indicates a version bump
          COMMIT_MSG=$(git log --format=%B -n 1 HEAD)
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG_EXISTS="${{ steps.check-tag.outputs.tag-exists }}"

          # Release if:
          # 1. Tag doesn't exist AND
          # 2. (Commit message contains version number OR setup.py was modified)
          if [ "$TAG_EXISTS" = "false" ]; then
            if echo "$COMMIT_MSG" | grep -q "$VERSION" || git diff HEAD~1 HEAD --name-only | grep -q "setup.py"; then
              echo "should-release=true" >> $GITHUB_OUTPUT
              echo "Version bump detected, will create release"
            else
              echo "should-release=false" >> $GITHUB_OUTPUT
              echo "No version bump detected"
            fi
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Tag already exists, skipping release"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # Builds the wheel and release notes with a read-only token, so nothing in
  # the build (pip, setuptools, build backends) can write to the repository.
  build:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Release notes need history and tags (git describe HEAD~1)
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build wheel
        run: |
          python -m build --wheel
          ls -la dist/

      - name: Generate release notes
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          # Try to extract release notes from docs/RELEASE_NOTES_*.md
          RELEASE_NOTES_FILE="docs/RELEASE_NOTES_${VERSION}.md"
          if [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "Using release notes from $RELEASE_NOTES_FILE"
            cat "$RELEASE_NOTES_FILE" > release_notes.md
          else
            echo "Generating automatic release notes"
            cat > release_notes.md << EOF
          # qxub $VERSION

          ## Changes

          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD~1)..HEAD)

          ## Installation

          \`\`\`bash
          pip install qxub==$VERSION
          # or download the wheel from this release
          \`\`\`

          See the documentation for more details.
          EOF
          fi

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.whl
            release_notes.md
          if-no-files-found: error

  # The only job with a write token. It runs no third-party code: it downloads
  # the build output and creates the tag and release with the gh CLI.
  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "qxub ${VERSION}" \
            --notes-file release_notes.md

      - name: Upload wheel to PyPI (optional)
        if: false  # Disabled by default - enable when ready for PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
