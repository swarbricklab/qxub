name: Runner Connection Test

# These jobs run on the self-hosted runner, which has SSH access to Gadi.
# They run only on a push to main (a merged PR) or a manual dispatch, never on
# pull_request, so PR authors cannot run their own steps on the runner. Keep
# it that way, and limit the runner group to these workflows on
# refs/heads/main.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-runner-qxub:
    runs-on: self-hosted

    steps:
    - name: Verify qxub installation
      run: |
        echo "=== Verifying qxub installation ==="
        which qxub
        qxub --version

    - name: Check qxub platform configuration
      run: |
        echo "=== Checking platform configuration ==="
        qxub platform list
        qxub config get defaults.platform || echo "No default platform set"
        # Note: qxub exec tests require SSH to NCI Gadi (the default platform)
        # Those tests are skipped since SSH keys may not be configured
