# One node, "slurm" (the container's hostname), in two partitions.
ClusterName=qxub
SlurmctldHost=slurm
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# No cgroups in a container: memory isn't enforced, walltime is.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
JobCompType=jobcomp/none

# Walltime kills soon after the limit, quickly cleaned up
OverTimeLimit=0
KillWait=5
InactiveLimit=0
MinJobAge=30
ReturnToService=2
SchedulerType=sched/backfill
MpiDefault=none
# The node's CPUs and memory are what this file says, whatever the host has
SlurmdParameters=config_overrides

NodeName=slurm CPUs=4 RealMemory=2000 State=UNKNOWN
PartitionName=cpu Nodes=slurm Default=YES MaxTime=INFINITE State=UP
PartitionName=debug Nodes=slurm MaxTime=00:30:00 State=UP
